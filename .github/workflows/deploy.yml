name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Determine Base Path
        run: |
          # If the repository is <username>.github.io, base is "/"
          # Otherwise (project repo), base is "/<repo-name>/"
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "${{ github.repository }}" =~ \.github\.io$ ]]; then
            echo "BASE_PATH=/" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/${REPO_NAME}/" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm install

      - name: Build site (Prerender static pages)
        run: npm run build
        env:
          BASE_PATH: ${{ env.BASE_PATH }}

      - name: Prepare static files for GitHub Pages
        run: |
          # Disable Jekyll processing
          touch .output/public/.nojekyll
          # Copy index.html to 404.html for SPA client-side routing fallback
          cp .output/public/index.html .output/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
